<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="HappySubs">
  <title>HappySubs</title>
  <!-- The app mark as geometry rather than a 128px bitmap, traced from
       icon128.png so the two cannot drift: an H over a pill. Needed because the
       promo tiles and the site draw it far larger than 128px, and upscaling the
       PNG shows it. -->
  <g fill="currentColor">
    <rect x="27" y="10" width="28" height="71"/>
    <rect x="73" y="10" width="28" height="71"/>
    <rect x="27" y="37" width="74" height="17"/>
    <rect x="9" y="95" width="110" height="23" rx="11.5"/>
  </g>
</svg>
