<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HappySubs Showreel</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  A 30-second motion piece for HappySubs, built as a deterministic timeline:
  every frame is a pure function of t, so the same page plays in a browser for
  preview and renders frame-exact to video (render.py calls window.__seek(t)).
  Brand: the site's near-black and signal red, the translation pink from the
  overlay, the popup's blush glass — and the wordmark's two stacked bars (white
  over red), which read as two lines of subtitle and carry the transitions.
-->
<style>
:root{
  --red:#ff0033; --logo:#e4262c; --pink:#f7c9c8; --ink:#0b0b0c; --white:#f5f5f5; --dim:#a3a3a3;
  --rose-ink:#3b2a2e; --rose-soft:#937b80; --accent:#df5550;
  --sans:"SF Pro Display","PingFang SC","Hiragino Sans","Apple SD Gothic Neo",sans-serif;
  --mono:Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#viewport{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--ink);font-family:var(--sans);color:#fff;-webkit-font-smoothing:antialiased}
#cam{position:absolute;inset:0;transform-origin:960px 540px}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;display:none}
.a{position:absolute}
.hl{font-weight:800;letter-spacing:-.035em;line-height:1.02;white-space:nowrap}
.red{color:var(--red)}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:.06em .05em .16em;margin:-.06em -.05em -.16em}
.wi{display:inline-block;transform:translateY(115%)}
/* Subtitle plates — mirror overlay.css: rounded plate hugging the words, soft
   text shadow, original white, translation pink. */
.cap{display:inline-block;background:rgba(0,0,0,.72);border-radius:10px;padding:5px 18px 7px;font-weight:600;
  text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap;line-height:1.3;letter-spacing:.005em}
.cap.o{color:#fff}
.cap.t{color:var(--pink)}
.caps{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:7px}
.mono{font-family:var(--mono)}

/* ---------- player ---------- */
.player{position:absolute;width:1280px;height:720px;border-radius:16px;overflow:hidden;background:#000;
  box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
.player .foot{position:absolute;inset:0}
.player .pgrad{position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.player .ctl{position:absolute;left:0;right:0;bottom:0;height:64px;padding:0 24px}
.player .bar{position:absolute;left:24px;right:24px;top:0;height:5px;background:rgba(255,255,255,.25);border-radius:3px}
.player .buf{position:absolute;left:0;top:0;bottom:0;width:62%;background:rgba(255,255,255,.35);border-radius:3px}
.player .fil{position:absolute;left:0;top:0;bottom:0;width:30%;background:var(--red);border-radius:3px}
.player .knob{position:absolute;top:-5px;width:15px;height:15px;margin-left:-7px;border-radius:50%;background:var(--red)}
.player .row{position:absolute;left:24px;right:24px;top:16px;height:40px;display:flex;align-items:center;gap:22px;font-size:17px;font-weight:500;color:#eee}
.player .row svg{width:28px;height:28px;fill:#fff}
.player .sp{flex:1}
.player .cc{position:relative;font-size:13px;font-weight:800;border:2.5px solid #fff;border-radius:5px;padding:1px 4px;letter-spacing:.04em}
.player .cc:after{content:"";position:absolute;left:-2px;right:-2px;bottom:-9px;height:3.5px;background:var(--red);border-radius:2px}
.player .ccx{position:absolute;left:-6px;top:50%;width:52px;height:4px;background:var(--red);transform:rotate(-35deg);opacity:0;border-radius:2px}
.player .whiteout{position:absolute;inset:0;background:#f5f5f5;opacity:0}

/* ---------- theatre footage ---------- */
.th{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:hidden;background:#120607}
.th>*{position:absolute}
.th-wall{inset:0;background:linear-gradient(#1d0b0c,#0e0506)}
.th-spot{left:340px;top:90px;width:600px;height:480px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,214,160,.62),rgba(255,170,110,.22) 45%,transparent 72%)}
.th-floor{left:0;right:0;bottom:0;height:200px;background:linear-gradient(#2e180c,#100703);box-shadow:0 -1px 0 rgba(255,200,140,.18)}
.th-pool{left:330px;bottom:46px;width:620px;height:140px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,226,170,.6),rgba(255,200,140,.14) 55%,transparent 72%)}
.th-cone{left:290px;top:-30px;width:700px;height:720px;transform-origin:50% 0;
  clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);
  background:linear-gradient(rgba(255,240,210,.30),rgba(255,230,190,.05));filter:blur(8px);mix-blend-mode:screen}
.th-actor{left:520px;bottom:62px;width:240px;height:400px;filter:drop-shadow(0 0 7px rgba(255,190,120,.45))}
.th-dust{inset:0}
.th-dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe9c9}
.th-cur{top:0;bottom:0;width:250px;
  background:repeating-linear-gradient(90deg,#4a0910 0,#8c1622 22px,#5c0c15 38px,#2e0509 50px)}
.th-cur.l{left:0;clip-path:polygon(0 0,100% 0,82% 72%,64% 100%,0 100%);box-shadow:inset -30px 0 40px rgba(0,0,0,.5)}
.th-cur.r{right:0;clip-path:polygon(0 0,100% 0,100% 100%,36% 100%,18% 72%)}
.th-val{left:0;right:0;top:0;height:92px;background:repeating-linear-gradient(90deg,#6b0f19 0,#a01b28 32px,#6b0f19 64px);
  -webkit-mask:radial-gradient(circle 46px at 46px 104px,transparent 45px,#000 46px) 0 0/92px 100% repeat-x;
  filter:drop-shadow(0 12px 16px rgba(0,0,0,.7))}
.th-vig{inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(0,0,0,.6) 100%)}

/* ---------- scene A: the feed wall ---------- */
#wall .card{position:absolute;width:320px}
#wall .thumb{position:relative;width:320px;height:180px;border-radius:12px;overflow:hidden}
#wall .thumb>div{position:absolute}
#wall .dur{right:8px;bottom:8px;padding:1px 6px;border-radius:5px;background:rgba(0,0,0,.8);font:600 15px var(--sans);color:#fff}
#wall .wp{left:0;bottom:0;height:4px;background:var(--red)}
#wall .meta{display:flex;gap:12px;margin-top:12px}
#wall .av{width:36px;height:36px;border-radius:50%;flex:none}
#wall .tl{flex:1;display:flex;flex-direction:column;gap:8px;padding-top:3px}
#wall .tl i{display:block;height:12px;border-radius:6px;background:#2b2b2e}
.stampbox{position:absolute;left:960px;top:172px;transform-origin:center}
.stamp{position:absolute;left:0;top:0;transform:translate(-50%,-50%) rotate(-3deg);background:var(--red);color:#fff;
  font-weight:900;font-size:104px;letter-spacing:-.03em;padding:2px 34px 8px;border-radius:14px;white-space:nowrap;
  box-shadow:0 20px 60px rgba(255,0,51,.45)}
.jag-r{clip-path:polygon(0 0,94% 0,100% 18%,95% 36%,100% 54%,95% 72%,100% 90%,96% 100%,0 100%)}
.jag-l{clip-path:polygon(4% 0,100% 0,100% 100%,0 100%,5% 82%,0 64%,5% 46%,0 28%,5% 10%)}

/* ---------- scene B: logo ---------- */
#bWM svg{display:block;width:1200px;overflow:visible}
#bWM path{transform-box:fill-box;transform-origin:50% 100%}
.bar{position:absolute;left:0;top:0}

/* ---------- popup (from popup.html) ---------- */
.pop{position:absolute;width:320px;padding:14px 14px 16px;font:13px/1.5 var(--sans);letter-spacing:.02em;color:var(--rose-ink);
  border-radius:16px;overflow:hidden;text-align:left;
  background:radial-gradient(190px 190px at calc(100% + 24px) -28px,rgba(255,112,112,.6),transparent 70%),
    radial-gradient(230px 230px at -46px calc(100% + 46px),rgba(255,170,140,.55),transparent 70%),
    linear-gradient(168deg,#fff8f8 0%,#ffecec 46%,#ffdedc 100%);
  box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.7)}
.pop .tb{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px;height:30px}
.pop .tb svg{height:19px;width:auto;color:var(--rose-ink)}
.pop .gear{font-size:19px;line-height:1}
.pop .main{background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.85);border-radius:14px;
  box-shadow:0 6px 22px rgba(163,92,92,.13);padding:10px 12px 12px}
.pop .r{display:flex;align-items:center;justify-content:space-between;margin:9px 0;gap:8px;white-space:nowrap}
.pop .cbx{display:inline-block;width:15px;height:15px;border-radius:4px;border:1.5px solid #c4a9ad;background:#fff;vertical-align:-3px;margin-right:7px;position:relative}
.pop .cbx.on{background:var(--accent);border-color:var(--accent)}
.pop .cbx.on:after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.pop .muted{color:var(--rose-soft);font-size:12px}
.pop .tabs{display:flex;gap:4px;margin:10px 0 12px;padding:4px;border-radius:12px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.85)}
.pop .tabs span{flex:1;text-align:center;padding:7px 6px;font-weight:600;border-radius:9px;color:var(--rose-soft)}
.pop .tabs .on{color:var(--accent);background:rgba(223,85,80,.16);font-weight:700}
.pop .fld{position:relative;flex:1 1 auto;min-width:0;height:30px;line-height:28px;padding:0 26px 0 8px;border-radius:9px;
  border:1px solid rgba(190,125,125,.24);background:rgba(255,255,255,.82);overflow:hidden;white-space:nowrap}
.pop .fld:after{content:"";position:absolute;right:10px;top:10px;width:6px;height:6px;border:solid var(--rose-ink);border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.pop .fld .roll{position:absolute;left:8px;top:0}
.pop .btn{height:30px;line-height:28px;padding:0 12px;border-radius:9px;border:1px solid rgba(190,125,125,.24);background:rgba(255,255,255,.82)}
.pop .status{margin:10px 12px 0;font-size:12px;color:var(--rose-soft);white-space:nowrap}
.pop .list{position:absolute;left:0;right:0;top:32px;background:#fff;border-radius:10px;box-shadow:0 12px 30px rgba(120,50,50,.25);padding:4px;z-index:3;transform-origin:50% 0}
.pop .list div{padding:3px 8px;border-radius:6px;white-space:nowrap}

/* ---------- scene D: timeline ---------- */
.tcard{position:absolute;left:120px;top:420px;width:1680px;height:470px;border-radius:20px;background:#121214;border:1px solid rgba(255,255,255,.1);overflow:hidden}
.tcard .lab{position:absolute;left:28px;font:600 21px var(--sans);color:#8d8d93}
.tblk{position:absolute;height:62px;border-radius:10px;padding:0 16px;font:600 23px/62px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tblk.o{background:#f5f5f5;color:#111}
.tblk.t{background:var(--pink);color:#3b1d22}
.wbar{position:absolute;width:4px;border-radius:2px}

/* ---------- scene G: tiles ---------- */
.tile{position:absolute;width:420px;height:334px;border-radius:26px;background:#151517;border:1px solid rgba(255,255,255,.1);overflow:hidden;padding:30px 30px}
.tile .tt{position:absolute;left:30px;bottom:58px;font:700 34px var(--sans);letter-spacing:-.01em;white-space:nowrap}
.tile .ts{position:absolute;left:30px;bottom:24px;font:500 21px var(--sans);color:#9a9aa0;white-space:nowrap}
.tile.blush{background:radial-gradient(260px 260px at 110% -10%,rgba(255,112,112,.55),transparent 70%),linear-gradient(168deg,#fff8f8,#ffdedc);color:var(--rose-ink);border-color:rgba(255,255,255,.8)}
.tile.blush .ts{color:var(--rose-soft)}
.chip{display:inline-block;padding:7px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.18);font:600 23px var(--sans);background:rgba(255,255,255,.06);white-space:nowrap}
.key{display:inline-flex;align-items:center;justify-content:center;width:86px;height:86px;border-radius:16px;background:linear-gradient(#2b2b30,#1d1d21);
  border:1px solid rgba(255,255,255,.16);box-shadow:0 6px 0 #0a0a0b,0 8px 16px rgba(0,0,0,.5);font:600 42px var(--sans)}

/* ---------- scene H: install ---------- */
.win{position:absolute;left:770px;top:160px;width:1060px;height:740px;border-radius:16px;overflow:hidden;background:#fff;
  box-shadow:0 50px 100px rgba(140,50,50,.28),0 0 0 1px rgba(0,0,0,.06)}
.win-top{height:46px;background:#efe7e7;display:flex;align-items:flex-end;padding:0 16px;gap:8px;position:relative}
.win-top .tl{width:13px;height:13px;border-radius:50%;position:absolute;top:16px}
.win-tab{margin-left:76px;height:36px;background:#fff;border-radius:10px 10px 0 0;padding:0 16px;display:flex;align-items:center;gap:9px;font:500 14px var(--sans);color:#333;width:300px}
.win-bar{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid #eee;position:relative}
.win-bar svg{width:20px;height:20px;stroke:#666;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.addr{flex:1;height:34px;border-radius:17px;background:#f1eded;display:flex;align-items:center;gap:8px;padding:0 14px;font:500 15px var(--sans);color:#333;position:relative;overflow:hidden}
.win-body{position:absolute;left:0;right:0;top:98px;bottom:0;overflow:hidden;background:#0f0f0f}
.site{position:absolute;inset:0;text-align:center;color:#f5f5f5}
.site .nav{height:52px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;padding:0 30px}
.site .nav svg{height:16px;color:#f5f5f5}
.site h1{margin:18px 0 10px;font:800 46px/1.1 var(--sans);letter-spacing:-.02em;background:linear-gradient(135deg,#fff,#bbb);-webkit-background-clip:text;color:transparent}
.site .vp{display:inline-block;color:#a3a3a3;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:2px 10px;font-size:13px}
.site p{color:#a3a3a3;font-size:16px;line-height:1.55;margin:14px auto 22px;max-width:560px}
.site .cta{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;padding:13px 28px;border-radius:999px;font:700 17px var(--sans);box-shadow:0 8px 20px rgba(255,0,51,.3);position:relative;overflow:hidden}
.site .cta2{display:inline-flex;color:#f5f5f5;padding:13px 26px;border-radius:999px;font:600 17px var(--sans);border:1px solid rgba(255,255,255,.34);margin-left:12px}
.stepc{position:absolute;width:58px;height:58px;border-radius:50%;border:2.5px solid var(--accent);color:var(--accent);font:800 26px/53px var(--sans);text-align:center}
.stepc .fillc{position:absolute;inset:-3px;border-radius:50%;background:var(--accent)}
.stepc .ck{position:absolute;left:19px;top:13px;width:14px;height:24px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg)}
.stepl{position:absolute;font:600 36px var(--sans);color:var(--rose-ink);white-space:nowrap;letter-spacing:-.01em}

/* ---------- scene I: montage ---------- */
.mshot{position:absolute;inset:0;overflow:hidden}
.mword{position:absolute;left:110px;top:84px;font:900 190px/1 var(--sans);letter-spacing:-.05em;color:#fff;text-shadow:0 10px 60px rgba(0,0,0,.35)}
.mtag{display:inline-block;padding:5px 14px;border-radius:999px;background:rgba(0,0,0,.55);font:700 20px var(--mono);color:#fff;letter-spacing:.04em;margin-bottom:6px}
.mcaps{position:absolute;left:0;right:0;bottom:92px;display:flex;flex-direction:column;align-items:center;gap:8px}

/* ---------- overlays ---------- */
#wipe{position:absolute;inset:0;pointer-events:none;display:none}
#wipe div{position:absolute;top:-80px;height:1240px;width:2600px;transform-origin:0 50%}
#grain{position:absolute;inset:-64px;pointer-events:none;mix-blend-mode:overlay;opacity:.11}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.42) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#measure{position:absolute;left:-9999px;top:0;visibility:hidden;font-family:var(--sans)}

/* ---------- preview UI (hidden when rendering) ---------- */
#ui{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;gap:12px;padding:0 14px;background:rgba(20,20,22,.92);color:#ddd;font:13px var(--mono);z-index:9}
#ui input{flex:1}
#ui button{background:#333;color:#fff;border:0;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
body.render #ui{display:none}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="cam"></div>
  <div id="wipe"><div id="wipeW" style="background:#f5f5f5"></div><div id="wipeR" style="background:var(--red)"></div></div>
  <div id="flash"></div>
  <div id="vig"></div>
  <div id="grain"></div>
  <div id="fade"></div>
</div></div>
<div id="measure"></div>
<svg width="0" height="0" style="position:absolute">
  <filter id="mbx" x="-20%" y="-5%" width="140%" height="110%"><feGaussianBlur id="mbxv" stdDeviation="0 0"/></filter>
  <filter id="mbx2" x="-20%" y="-5%" width="140%" height="110%"><feGaussianBlur id="mbxv2" stdDeviation="0 0"/></filter>
</svg>
<div id="ui"><button id="play">Play</button><input id="scrub" type="range" min="0" max="30" step="0.001" value="0"><span id="tc">0.00</span></div>

<script src="wordmark.js"></script>
<script>
"use strict";
/* =====================================================================
   Toolkit
   ===================================================================== */
const DUR = 30;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const E = {
  lin: t => t,
  inQuad: t => t * t, outQuad: t => 1 - (1 - t) * (1 - t),
  inCubic: t => t * t * t, outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outQuart: t => 1 - Math.pow(1 - t, 4), inQuart: t => t * t * t * t,
  inOutQuart: t => t < .5 ? 8 * t ** 4 : 1 - Math.pow(-2 * t + 2, 4) / 2,
  outQuint: t => 1 - Math.pow(1 - t, 5),
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => { const s = 1.9; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); },
  outBackS: t => { const s = 1.2; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); },
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
};
const P = (t, a, b, e = E.lin) => e(inv(a, b, t));
// Damped spring step response, 0 → 1 (overshoots when damp < 1).
function spring(dt, freq = 2, damp = .5) {
  if (dt <= 0) return 0;
  const w = 2 * Math.PI * freq, wd = w * Math.sqrt(1 - damp * damp);
  return 1 - Math.exp(-damp * w * dt) * (Math.cos(wd * dt) + (damp * w / wd) * Math.sin(wd * dt));
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const noise = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
const $ = id => document.getElementById(id);
const h = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };
const tf = (el, s) => { el.style.transform = s; };
const op = (el, v) => { el.style.opacity = v; };
const vis = (el, on) => { el.style.visibility = on ? 'visible' : 'hidden'; };
const beat = (t, from = 6, to = 30) => (t < from || t > to) ? 0 : Math.exp(-((t - from) % .5) * 7);

const words = (text, cls = '') => text.split(' ').map(w => `<span class="w"><span class="wi ${cls}">${w}</span></span>`).join(' ');
// Word-by-word mask reveal; each word rises out of its own clip box.
function wordsAnim(root, t, tin, tout = 1e9, st = .055, dur = .5, ost = .03) {
  const ws = root.__wi || (root.__wi = [...root.querySelectorAll('.wi')]);
  ws.forEach((w, i) => {
    const pi = E.outExpo(inv(tin + i * st, tin + i * st + dur, t));
    const po = E.inCubic(inv(tout + i * ost, tout + i * ost + .3, t));
    w.style.transform = `translateY(${(1 - pi) * 115 - po * 115}%)`;
  });
}
const measureBox = $('measure');
function measure(html, style) {

    <div class="a" style="left:0;right:0;bottom:0;height:46px;background:linear-gradient(#7a5532,#4e3420)"></div>`;
  if (i === 1) return `<div class="a" style="inset:0;background:radial-gradient(ellipse at 50% 20%,#273b74,#0d1430 70%)"></div>
    <div class="a" style="left:820px;top:150px;width:860px;height:500px;border-radius:18px;background:#f4f6fb;box-shadow:0 0 120px rgba(120,160,255,.45)">
      <div class="a" style="left:48px;top:36px;font:800 40px var(--sans);color:#1b2240">Q3 Roadmap</div>
      ${[.35, .5, .62, .8, .95].map((v, k) => `<div class="a mbar" data-v="${v}" style="left:${80 + k * 150}px;bottom:50px;width:96px;height:${v * 320}px;border-radius:10px 10px 0 0;background:${k === 4 ? '#ff0033' : '#9aa7cf'};transform-origin:50% 100%"></div>`).join('')}</div>
    <div class="a" style="left:0;right:0;bottom:0;height:200px">${Array.from({ length: 16 }, (_, k) => `<div class="a" style="left:${k * 124 - 20}px;bottom:${-40 + (k % 2) * 16}px;width:150px;height:170px;border-radius:75px 75px 0 0;background:#060a18"></div>`).join('')}</div>`;
  if (i === 2) return `<div class="a" style="inset:0;background:radial-gradient(ellipse at 30% 30%,#ffb36b,#d9612e 55%,#7a2a12)"></div>
    <div class="a" style="left:420px;top:330px;width:1080px;height:520px;border-radius:40px;background:linear-gradient(#c48a52,#9a6431);box-shadow:0 40px 80px rgba(0,0,0,.35)"></div>
    <div class="a" style="left:640px;top:360px;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle at 45% 40%,#3a3a3e,#151517 70%);box-shadow:0 30px 60px rgba(0,0,0,.5)"></div>
    <div class="a" style="left:1060px;top:560px;width:420px;height:46px;border-radius:23px;background:#151517"></div>
    ${[[720, 470], [860, 520], [790, 610], [930, 650], [980, 470]].map(([x, y]) => `<div class="a" style="left:${x}px;top:${y}px;width:70px;height:46px;border-radius:50%;background:#f3d9a8;box-shadow:inset -6px -6px 0 #d8b67c"></div>`).join('')}
    ${[0, 1, 2].map(k => `<div class="a msteam" data-k="${k}" style="left:${760 + k * 90}px;top:260px;width:80px;height:200px;border-radius:40px;background:rgba(255,255,255,.35);filter:blur(18px)"></div>`).join('')}`;
  return `<div class="a" style="inset:0;background:linear-gradient(#2b1055 0%,#7a2b7a 38%,#d53369 62%,#ffb88c 100%)"></div>
    <div class="a" style="left:760px;top:330px;width:400px;height:400px;border-radius:50%;background:linear-gradient(#ffe29f,#ff7e5f);-webkit-mask:repeating-linear-gradient(#000 0 34px,transparent 34px 44px)"></div>
    <div class="a" style="left:0;right:0;bottom:0;height:380px">${Array.from({ length: 22 }, (_, k) => { const R = mulberry32(k + 40); return `<div class="a" style="left:${k * 90 - 10}px;bottom:0;width:${70 + R() * 40}px;height:${120 + R() * 240}px;background:#1b0b2e"></div>`; }).join('')}</div>
    ${Array.from({ length: 18 }, (_, k) => `<div class="a mpetal" data-k="${k}" style="width:18px;height:12px;border-radius:12px 0;background:#ffc6d9"></div>`).join('')}`;
}
scene('sI', 24.0, 26.0, (el) => {
  el.innerHTML = MONT.map((m, i) => `<div class="mshot" id="m${i}">${montArt(i)}<div class="mword">${m[0]}</div>
    <div class="mcaps"><span class="mtag">${m[1]}</span><div class="cap o" style="font-size:44px">${m[2]}</div><div class="cap t" style="font-size:48px">${m[3]}</div></div></div>`).join('') +
    `<div class="a mono" id="mIdx" style="right:110px;top:110px;font-size:26px;font-weight:700;color:rgba(255,255,255,.85)"></div>`;
}, (t) => {
  const k = Math.min(3, Math.floor((t - 24) / .5)), dt = t - 24 - k * .5;
  MONT.forEach((_, i) => { $('m' + i).style.display = i === k ? '' : 'none'; });
  const m = $('m' + k), pz = E.outQuart(inv(0, .5, dt));
  tf(m, `scale(${1.12 - .12 * pz})`);
  m.style.filter = dt < .07 ? `brightness(${1 + (1 - dt / .07) * .8})` : '';
  const wd = m.querySelector('.mword'); tf(wd, `translateY(${(1 - E.outExpo(inv(0, .25, dt))) * 80}px)`); op(wd, clamp(dt * 14));
  const cp = m.querySelector('.mcaps'); tf(cp, `translateY(${(1 - E.outExpo(inv(.03, .3, dt))) * 50}px)`); op(cp, clamp((dt - .03) * 12));
  $('mIdx').textContent = `0${k + 1} / 04`;
  if (k === 0) { const tan = m.querySelector('.mtan'); tan.style.strokeDashoffset = 460 * (1 - E.outCubic(inv(24.05, 24.45, t))); }
  if (k === 1) m.querySelectorAll('.mbar').forEach((b, j) => tf(b, `scaleY(${E.outBack(inv(24.5 + j * .04, 24.8 + j * .04, t))})`));
  if (k === 2) m.querySelectorAll('.msteam').forEach(s => { const q = ((t * 1.6 + +s.dataset.k * .33) % 1); tf(s, `translateY(${-q * 120}px) scaleX(${1 + q * .6})`); op(s, Math.sin(q * Math.PI)); });
  if (k === 3) m.querySelectorAll('.mpetal').forEach(p => { const j = +p.dataset.k, x = (hash(j) * 2100 + t * 260) % 2100 - 100, y = (hash(j + 7) * 1100 + t * 180) % 1100 - 40; tf(p, `translate(${x}px,${y}px) rotate(${t * 200 + j * 40}deg)`); });
  // funnel into the end card
  const f = E.inExpo(inv(25.78, 26.0, t));
  tf(SC.sI.el, `scale(${1 - f * .96})`); SC.sI.el.style.borderRadius = (f * 400) + 'px'; op(SC.sI.el, 1 - inv(25.9, 26.0, t));
});

/* ---------------------------------------------------------------------
   J · 25.95–30.0  End card.
   --------------------------------------------------------------------- */
scene('sJ', 25.95, 30.01, (el) => {
  let dots = ''; const R = mulberry32(9);
  for (let i = 0; i < 60; i++) dots += `<div class="a jd" data-x="${R() * 1920}" data-y="${R() * 1080}" data-s="${.3 + R()}" style="width:${R() < .5 ? 14 : 5}px;height:4px;border-radius:2px;background:${R() < .3 ? '#ff0033' : 'rgba(255,255,255,.5)'}"></div>`;
  let parts = ''; const R2 = mulberry32(17);
  for (let i = 0; i < 40; i++) parts += `<div class="a" data-a="${(i / 40) * Math.PI * 2}" data-r="${300 + R2() * 600}" style="left:960px;top:250px;width:${30 + R2() * 60}px;height:5px;border-radius:3px;background:${i % 2 ? '#ff0033' : '#fff'};transform-origin:0 50%"></div>`;
  el.innerHTML = `
    <div class="a" id="jGlow" style="left:160px;top:-450px;width:1600px;height:1400px;background:radial-gradient(closest-side,rgba(255,0,51,.34),rgba(255,0,51,.06) 60%,transparent)"></div>
    <div class="a" style="inset:0">${dots}</div>
    <div class="a" id="jRing" style="left:960px;top:250px;border:3px solid #ff0033;border-radius:50%"></div>
    <div class="a" id="jParts" style="inset:0">${parts}</div>
    <div class="a" id="jIcon" style="left:880px;top:170px;width:160px;height:160px;filter:drop-shadow(0 14px 40px rgba(255,0,51,.5))">${iconSVG()}</div>
    <div class="a" id="jWM" style="left:540px;top:372px;width:840px;color:#f5f5f5">${wordmarkSVG()}</div>
    <svg class="a" id="jSweep" style="left:540px;top:372px;width:840px;overflow:visible" viewBox="139 553 7754 1156"><defs><linearGradient id="swg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1400" y2="500"><stop offset="0" stop-color="#ff0033" stop-opacity="0"/><stop offset=".5" stop-color="#ff2d55" stop-opacity=".9"/><stop offset="1" stop-color="#ff0033" stop-opacity="0"/></linearGradient></defs><g fill="url(#swg)">${WM_PATHS.map(d => `<path d="${d}"/>`).join('')}</g></svg>
    <div class="caps" id="jTag" style="top:552px;gap:9px"><div class="cap o" style="font-size:42px">Watch anything. Understand everything.</div><div class="cap t" style="font-size:46px">看懂每一个视频。</div></div>
    <div class="a" id="jCta" style="left:0;right:0;top:744px;text-align:center"><span style="display:inline-flex;align-items:center;gap:14px;background:var(--red);color:#fff;padding:20px 46px;border-radius:999px;font:700 34px var(--sans);box-shadow:0 14px 40px rgba(255,0,51,.45)">Add to Chrome <span style="opacity:.75;font-weight:600">— it’s free</span></span></div>
    <div class="a mono" id="jUrl" style="left:0;right:0;top:868px;text-align:center;font-size:26px;color:#cfcfd4">huanshuowang.com/happysubs</div>
    <div class="a" id="jPlat" style="left:0;right:0;top:920px;text-align:center;font:600 20px var(--sans);color:#8d8d93;letter-spacing:.32em">YOUTUBE · VIMEO · BILIBILI</div>`;
  el.querySelectorAll('#jWM .wl').forEach(p => { p.style.transformBox = 'fill-box'; p.style.transformOrigin = '50% 100%'; });
}, (t) => {
  const ic = spring(t - 26.0, 1.9, .42);
  tf($('jIcon'), `scale(${ic}) rotate(${(1 - ic) * -20}deg)`); op($('jIcon'), t >= 26 ? 1 : 0);
  const r = $('jRing'), d = 1700 * E.outExpo(inv(26.0, 26.8, t)); r.style.width = r.style.height = d + 'px'; r.style.marginLeft = r.style.marginTop = -d / 2 + 'px'; op(r, t < 26 ? 0 : 1 - inv(26, 26.75, t));
  const pr = E.outExpo(inv(26.0, 26.8, t)), pe = $('jParts').__p || ($('jParts').__p = [...$('jParts').children]);
  pe.forEach(p => { const a = +p.dataset.a, rr = +p.dataset.r * pr; tf(p, `translate(${Math.cos(a) * rr}px,${Math.sin(a) * rr}px) rotate(${a}rad) scaleX(${1 - pr * .7})`); op(p, t < 26 ? 0 : 1 - inv(26.2, 26.85, t)); });
  const paths = $('jWM').__p || ($('jWM').__p = [...$('jWM').querySelectorAll('.wl')]);
  paths.forEach((p, i) => { const q = E.outBack(inv(26.25 + i * .035, 26.6 + i * .035, t)); p.style.transform = `translateY(${(1 - q) * 300}px)`; p.style.opacity = clamp(q * 3); });
  const bars = $('jWM').querySelectorAll('.wb1,.wb2'), bq = E.outExpo(inv(26.55, 26.85, t));
  const blink = (t > 28.55 && t < 28.72) || (t > 29.05 && t < 29.22) ? 0 : 1;
  bars.forEach((b, i) => { b.style.transformBox = 'fill-box'; b.style.transformOrigin = '0 50%'; b.style.transform = `scaleX(${bq})`; b.style.opacity = blink; });
  [...$('jTag').children].forEach((c, i) => { const p = E.outExpo(inv(26.75 + i * .12, 27.25 + i * .12, t)); c.style.clipPath = `inset(0 ${50 * (1 - p)}% 0 ${50 * (1 - p)}% round 10px)`; op(c, p > 0 ? 1 : 0); });
  const cs = spring(t - 27.2, 2, .5); tf($('jCta'), `scale(${cs})`); op($('jCta'), t > 27.2 ? 1 : 0);
  op($('jUrl'), E.outCubic(inv(27.45, 27.75, t))); tf($('jUrl'), `translateY(${(1 - E.outExpo(inv(27.45, 27.9, t))) * 24}px)`);
  op($('jPlat'), E.outCubic(inv(27.6, 27.95, t)));
  $('swg').setAttribute('gradientTransform', `translate(${lerp(-1600, 8000, E.inOutCubic(inv(28.0, 28.75, t)))},0)`);
  op($('jSweep'), t > 27.95 && t < 28.8 ? 1 : 0);
  op($('jGlow'), .7 + .3 * beat(t, 26, 28) + .1 * Math.sin(t * 2));
  SC.sJ.el.querySelectorAll('.jd').forEach(dd => { const s = +dd.dataset.s; tf(dd, `translate(${+dd.dataset.x + Math.sin(t * s + s * 9) * 30}px,${((+dd.dataset.y - (t - 26) * 40 * s) % 1080 + 1080) % 1080}px)`); op(dd, .2 + .5 * s * inv(26.1, 26.8, t)); });
  tf(SC.sJ.el, `scale(${1.04 - .04 * E.outCubic(inv(26, 30, t))})`);
});

/* =====================================================================
   Overlays: wipe, flash, grain, camera
   ===================================================================== */
const SC = {}; SCENES.forEach(s => SC[s.id] = s);
function setBlur(el, fid, px) {
  const f = $(fid);
  if (px > .5) { f.setAttribute('stdDeviation', `${px} 0`); el.style.filter = `url(#${fid === 'mbxv' ? 'mbx' : 'mbx2'})`; }
  else el.style.filter = '';
}
const grain = $('grain');
(function makeGrain() {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'), im = x.createImageData(256, 256), R = mulberry32(99);
  for (let i = 0; i < im.data.length; i += 4) { const v = R() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  x.putImageData(im, 0, 0); grain.style.backgroundImage = `url(${c.toDataURL()})`;
})();
function render(t) {
  for (const s of SCENES) {
    const on = t >= s.a && t < s.b;
    if (on !== s.on) { s.el.style.display = on ? 'block' : 'none'; s.on = on; }
    if (on) s.update(t);
  }
  // wipe 7.58–8.25
  const wipe = $('wipe'), won = t > 7.55 && t < 8.3; wipe.style.display = won ? 'block' : 'none';
  if (won) {
    const L = tt => lerp(-2900, 2400, E.inOutCubic(inv(7.58, 8.1, tt)));
    tf($('wipeW'), `translateX(${L(t)}px) skewX(-14deg)`); tf($('wipeR'), `translateX(${L(t - .075)}px) skewX(-14deg)`);
  }
  // flash on the two big hits
  let fl = 0; [[6.0, .9], [26.0, .7], [14.92, .0]].forEach(([a, k]) => { if (t >= a) fl = Math.max(fl, k * (1 - inv(a, a + .16, t))); });
  op($('flash'), fl);
  // camera: shake + punch
  let sx = 0, sy = 0, sr = 0, sc = 1;
  IMPACTS.forEach(([a, k], i) => {
    const dt = t - a; if (dt < 0 || dt > .6) return;
    const amp = k * Math.exp(-dt * 9);
    sx += amp * noise(dt * 38 + i * 13); sy += amp * noise(dt * 38 + i * 13 + 50); sr += amp * .045 * noise(dt * 30 + i * 7 + 99);
    sc += (k / 400) * Math.exp(-dt * 10);
  });
  tf(cam, `translate(${sx}px,${sy}px) rotate(${sr}deg) scale(${sc})`);
  // grain jumps every frame; lighter over the blush scene
  const fr = Math.floor(t * 60);
  grain.style.backgroundPosition = `${Math.floor(hash(fr) * 256)}px ${Math.floor(hash(fr + 1) * 256)}px`;
  const blush = t > 19.9 && t < 24 ? 1 : 0;
  op(grain, blush ? .06 : .11); op($('vig'), blush ? .25 : 1);
  op($('fade'), Math.max(1 - inv(0, .12, t), E.inQuad(inv(29.5, 30, t))));
}

/* =====================================================================
   Boot: measure the plates that animate their width, then go.
   ===================================================================== */
function boot() {
  LANG_W = LANGS.map(l => measure(l[1], 'font-size:44px'));
  FRAG_W = FRAGS.map(f => measure(f[0], 'font-size:44px'));
  LIVE_SW = LIVE_SRC.map(s => measure(s[1], 'font-size:46px'));
  LIVE_TW = LIVE_TR.map(s => measure(s[1], 'font-size:48px'));
  // the roll plate needs side padding added back
  LANG_W = LANG_W.map(w => w + 4);
  window.__seek = (t) => { render(t); return true; };
  window.__ready = true;
  if (!document.body.classList.contains('render')) startPreview();
}
function fit() {
  const s = Math.min(innerWidth / 1920, (innerHeight - (document.body.classList.contains('render') ? 0 : 46)) / 1080);
  $('viewport').style.transform = `scale(${s})`;
}
function startPreview() {
  let playing = false, t0 = 0, tAt = 0; const scrub = $('scrub'), tc = $('tc');
  const audio = new Audio('soundtrack.wav');
  const seek = t => { tAt = t; render(t); scrub.value = t; tc.textContent = t.toFixed(2); };
  $('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; if (playing) { if (tAt >= DUR - .01) tAt = 0; t0 = performance.now() / 1000 - tAt; audio.currentTime = tAt; audio.play().catch(() => { }); } else audio.pause(); };
  scrub.oninput = () => { seek(+scrub.value); if (playing) { t0 = performance.now() / 1000 - tAt; audio.currentTime = tAt; } };
  const q = new URLSearchParams(location.search); seek(+(q.get('t') || 0));
  (function loop() { if (playing) { const t = performance.now() / 1000 - t0; if (t >= DUR) { playing = false; $('play').textContent = 'Play'; seek(DUR - .001); } else seek(t); } requestAnimationFrame(loop); })();
}
if (new URLSearchParams(location.search).has('render')) document.body.classList.add('render');
addEventListener('resize', fit); fit();
document.fonts.ready.then(boot);
</script>
