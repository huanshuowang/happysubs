<!doctype html>
<meta charset="utf-8">
<title>HappySubs popup — screenshot rig</title>
<!--
  Renders the real popup for the store screenshots: real popup.html markup, real
  i18n.js and popup.js, driven by the same chrome.* stub the test harness uses.
  Nothing here is a redrawing of the UI — it is the shipped UI with a plausible
  video behind it.

    ?view=main|settings   which screen to shoot
    ?scheme=dark|light    the popup's own colour scheme

  The scheme is forced by rewriting the popup's own prefers-color-scheme block
  into a plain rule, because headless Chrome will not emulate the media query
  from the command line. The declarations inside it are untouched.
-->
<style>
  html,body{margin:0;padding:0;background:transparent}
  /* the popup sizes itself; this is just the canvas it sits on */
  #mount{width:320px;margin:0;padding:0;display:block}
</style>
<div id="mount"></div>
<script>
const Q = new URLSearchParams(location.search);
const VIEW   = Q.get("view")   || "main";
const SCHEME = Q.get("scheme") || "dark";

const STORE = { ydsSettings: {
  enabled: true, secondLang: "zh-Hans", uiLang: "en", translationOnly: false,
  bottomOffset: 22, fontSize: 22, color: "#ffffff", background: "rgba(0,0,0,0.6)",
  captionWidth: 80, unifyStyles: false, sourceFontSize: 22, sourceColor: "#ffffff",
  subtitleMode: "inline", takeoverCaptions: true,
  translationProvider: "google", paidApiMode: "ask", apiKeys: {}, models: {}
} };
window.chrome = {
  runtime: { id: "yds-shot", getURL: (f) => "/" + f, lastError: null },
  i18n: { getUILanguage: () => "en-US" },
  storage: {
    sync: {
      get: () => Promise.resolve(JSON.parse(JSON.stringify(STORE))),
      set: (obj) => { Object.assign(STORE, obj); return Promise.resolve(); }
    },
    onChanged: { addListener() {} }
  },
  tabs: {
    query: () => Promise.resolve([{ id: 1, url: "https://www.youtube.com/watch?v=abc" }]),
    sendMessage: (id, msg, cb) => cb && cb({
      platform: "youtube", videoId: "abc",
      sourceIsAsr: true, drawnInOwnBox: true, drawsSourceLine: true,
      tracks: [{ languageCode: "en", kind: "asr", name: "English (auto)" }],
      translations: [], settings: STORE.ydsSettings, nativeCaptionText: "",
      translationStatus: { mode: "translated", provider: "google", cueCount: 184 },
      preCuesLoaded: 184, usingNativeTrack: false,
      live: { active: false, status: "stopped", detail: "" }
    })
  }
};

const loadScript = (src) => new Promise((res, rej) => {
  const s = document.createElement("script");
  s.src = src + "?cb=" + Date.now();
  s.onload = res; s.onerror = rej;
  document.body.appendChild(s);
});

(async () => {
  const html = await (await fetch("../popup.html?cb=" + Date.now())).text();
  const parsed = new DOMParser().parseFromString(html, "text/html");

  // Force the scheme. The popup's dark rules live in one media block; lifting
  // its body out makes them unconditional, and deleting the block leaves light.
  const styleEl = parsed.querySelector("style");
  let css = styleEl.textContent;
  const at = css.indexOf("@media (prefers-color-scheme: dark)");
  if (at >= 0) {
    // walk the braces so the block is cut exactly, nested rules included
    let i = css.indexOf("{", at), depth = 0, end = -1;
    for (let j = i; j < css.length; j++) {
      if (css[j] === "{") depth++;
      else if (css[j] === "}") { depth--; if (depth === 0) { end = j; break; } }
    }
    const inner = css.slice(i + 1, end);
    css = css.slice(0, at) + (SCHEME === "dark" ? inner : "") + css.slice(end + 1);
    // :root wins over the scheme hint the popup sets for form controls
    if (SCHEME === "dark") css += "\n:root{color-scheme:dark}";
  }
  // The popup styles its own <body>; injected into this page those rules would
  // paint the whole canvas, so they are rescoped to the element it mounts in.
  // Then everything around the popup stays transparent and crops away cleanly.
  css = css.replace(/(^|\})(\s*)body\s*\{/g, "$1$2#mount{");
  css = css.replace(/html\s*,\s*#mount\s*\{/g, "#mount{");
  styleEl.textContent = css;

  document.head.appendChild(styleEl);
  document.getElementById("mount").append(...parsed.body.childNodes);
  await loadScript("../i18n.js");
  await loadScript("../languages.js");
  await loadScript("../popup.js");
  await new Promise(r => setTimeout(r, 600));

  if (VIEW === "settings") document.getElementById("openSettings").click();
  await new Promise(r => setTimeout(r, 400));

  // A real-looking status line instead of the stub's "no tab" text.
  // the stub's video id is debug noise in a poster
  const vi = document.getElementById("videoInfo"); if (vi) vi.textContent = "";
  const st = document.getElementById("status");
  if (st && VIEW === "main") st.textContent = "Translated · Google Translate · 184 lines";

  document.title = "ready";
})();
</script>
